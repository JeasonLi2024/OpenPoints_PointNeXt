# Dataset: separate local train/test roots, each point is xyz + normal.
num_points: 1024
dataset:
  common:
    NAME: ModelNet40SeparateNormals
    train_data_dir: ./modelnet40_train_data/modelnet40_normal_resampled
    test_data_dir: ./modelnet40_test_data/modelnet40_normal_resampled/test
    num_classes: 40
    use_normals: true
    normalize_xyz: true
    val_ratio: 0.15
    split_seed: 42
  train:
    split: train
    num_points: 1024
  val:
    split: val
    num_points: 1024
  test:
    split: test
    num_points: 1024

feature_keys: pos,normal

datatransforms:
  train: [PointsToTensor, PointCloudScaleAndTranslate]
  val: [PointsToTensor]
  test: [PointsToTensor]
  vote: [PointCloudScaleAndTranslate]
  kwargs:
    # Isotropic scaling keeps the supplied normal directions geometrically valid.
    anisotropic: false
    shift: [0.2, 0.2, 0.2]

batch_size: 32
val_batch_size: 64
dataloader:
  num_workers: 8

num_classes: 40

# Official ModelNet40 PointNeXt training recipe.
sched: cosine
epochs: 600
warmup_epochs: 0
min_lr: null
lr: 0.001
optimizer:
  NAME: adamw
  weight_decay: 0.05
grad_norm_clip: 1
criterion_args:
  NAME: SmoothCrossEntropy
  label_smoothing: 0.2

log_dir: modelnet40_normals
print_freq: 10
val_freq: 1
pretrained_path: null
seed: 42
wandb:
  project: PointNeXt-ModelNet40-Normals
